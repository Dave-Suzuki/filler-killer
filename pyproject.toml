[project]
name = "filler-killer"
version = "0.1.0"
description = "Eliminate filler words: post-meeting reflection from Granola transcripts + real-time warnings during calls"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Real-time listener (Mac only): Apple Speech framework via PyObjC — free,
# on-device, no API key, audio never leaves the machine.
realtime = [
    "rumps>=0.4 ; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
fk = "fillerkiller.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fillerkiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
