<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}filler-killer{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
    --accent: #b4552d; --line: #e4e2dd;
    --c-phrase: #f5d9c8; --c-discourse: #d8e4f0; --c-repetition: #e9d8f0; --c-vocalized: #f0e2b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161613; --card: #201f1b; --ink: #ebe9e4; --muted: #9a978f;
      --accent: #e08a5c; --line: #35332d;
      --c-phrase: #6b3d22; --c-discourse: #2c4258; --c-repetition: #4d3358; --c-vocalized: #5c4d1e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 1rem; }
  header h1 { font-size: 1.1rem; margin: 0; }
  header h1 a { color: var(--ink); text-decoration: none; }
  header .tag { color: var(--muted); font-size: .85rem; }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
           gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 1rem 1.2rem; }
  .card .num { font-size: 1.7rem; font-weight: 650; }
  .card .lbl { color: var(--muted); font-size: .82rem; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           padding: 1.2rem; margin-bottom: 1.5rem; overflow-x: auto; }
  h2 { font-size: 1rem; margin: 0 0 .8rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 550; font-size: .8rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  mark { border-radius: 4px; padding: 0 .15em; color: inherit; }
  mark.cat-phrase { background: var(--c-phrase); }
  mark.cat-discourse { background: var(--c-discourse); }
  mark.cat-repetition { background: var(--c-repetition); }
  mark.cat-vocalized { background: var(--c-vocalized); }
  .utt { margin: 0 0 .7rem; }
  .utt .spk { font-weight: 650; font-size: .8rem; color: var(--muted); display: block; }
  .utt.me .spk { color: var(--accent); }
  .legend { color: var(--muted); font-size: .8rem; margin-top: .6rem; }
  .legend mark { margin-right: .6rem; }
  .toolbar { display: flex; justify-content: space-between; align-items: center;
             gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .ranges { display: flex; gap: .3rem; background: var(--card);
            border: 1px solid var(--line); border-radius: 8px; padding: .25rem; }
  .ranges a { padding: .3rem .8rem; border-radius: 6px; text-decoration: none;
              color: var(--muted); font-size: .85rem; }
  .ranges a.active { background: var(--accent); color: var(--card); font-weight: 600; }
  .toolbar button { background: var(--card); color: var(--ink); font: inherit;
                    font-size: .85rem; border: 1px solid var(--line);
                    border-radius: 8px; padding: .45rem .9rem; cursor: pointer; }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .notice { color: var(--muted); font-size: .85rem; margin: 0 0 1rem; }
  .notice.error { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><a href="/">filler-killer</a></h1>
  <span class="tag">say what you mean</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
